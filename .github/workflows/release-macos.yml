name: Release (macOS)

# Builds the macOS DMG + ZIP artifacts. Runs:
#   - on tag push matching v* (publishes a GitHub Release)
#   - on manual dispatch (uploads artifacts only, no release)
#
# Code-signing & notarization will activate automatically when the secrets
# CSC_LINK, CSC_KEY_PASSWORD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, and
# APPLE_TEAM_ID are present. Without them, electron-builder produces an
# ad-hoc-signed (unsigned) bundle — fine for internal testing, will be flagged
# by Gatekeeper for end users (see SETUP.md).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish a GitHub Release (only relevant for tag-like manual runs)'
        type: boolean
        default: false

permissions:
  contents: write   # needed by softprops/action-gh-release to create releases

jobs:
  build:
    name: Build & Package
    runs-on: macos-14          # Apple Silicon runner — produces arm64 + x64 via electron-builder

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download sounds (best-effort, CDN may rate-limit CI)
        run: |
          pip3 install --quiet requests
          python3 scripts/download_sounds.py
        continue-on-error: true

      - name: Generate app icon from SVG
        run: |
          brew install --quiet librsvg
          make icon-from-svg

      - name: Rebuild example .mbpack
        run: make example-pack

      - name: Build & package (DMG + ZIP, arm64 + x64)
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # electron-builder picks these up automatically when present:
          CSC_LINK:                  ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD:          ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID:                  ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID:             ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MeetingBoost-${{ github.ref_name }}
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_release == true
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.dmg
            release/*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
