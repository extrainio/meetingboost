name: Release (macOS)

# Builds the macOS DMG + ZIP artifacts. Runs:
#   - on tag push matching v* (publishes a GitHub Release)
#   - on manual dispatch (uploads artifacts only, no release)
#
# Code-signing & notarization will activate automatically when the secrets
# CSC_LINK, CSC_KEY_PASSWORD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, and
# APPLE_TEAM_ID are present. Without them, electron-builder produces an
# ad-hoc-signed (unsigned) bundle — fine for internal testing, will be flagged
# by Gatekeeper for end users (see SETUP.md).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish a GitHub Release (only relevant for tag-like manual runs)'
        type: boolean
        default: false

permissions:
  contents: write   # needed by softprops/action-gh-release to create releases

jobs:
  build:
    name: Build & Package
    runs-on: macos-14          # Apple Silicon runner — produces arm64 + x64 via electron-builder

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download sounds (best-effort, CDN may rate-limit CI)
        run: |
          pip3 install --quiet requests
          python3 scripts/download_sounds.py
        continue-on-error: true

      - name: Generate app icon from SVG
        run: |
          brew install --quiet librsvg
          make icon-from-svg

      - name: Rebuild example .mbpack
        run: make example-pack

      # Detect once whether signing secrets are present. We can't put env
      # blocks behind an `if:` and an empty `${{ secrets.CSC_LINK }}` is the
      # string '' (not unset), which electron-builder mis-interprets as a
      # file path. So we explicitly export OR unset them in a shell step.
      - name: Resolve signing mode
        id: signing
        env:
          HAS_CSC: ${{ secrets.CSC_LINK != '' && secrets.CSC_KEY_PASSWORD != '' }}
        run: |
          if [ "$HAS_CSC" = "true" ]; then
            echo "Signing secrets detected — building signed artifacts."
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No signing secrets — building unsigned (ad-hoc) artifacts."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      # When CSC + Apple notary secrets are all present, also require Gatekeeper (spctl) to pass CI.
      - name: Resolve bundle verification strictness
        id: verify
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
          HAS_NOTARY_CREDS: ${{ secrets.APPLE_ID != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
        run: |
          if [ "$SIGNED" = "true" ] && [ "$HAS_NOTARY_CREDS" = "true" ]; then
            echo "require_gatekeeper=1" >> "$GITHUB_OUTPUT"
          else
            echo "require_gatekeeper=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Build & package (signed)
        if: steps.signing.outputs.signed == 'true'
        run: npm run dist
        env:
          GH_TOKEN:                    ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK:                    ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD:            ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID:                    ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID:               ${{ secrets.APPLE_TEAM_ID }}

      - name: Build & package (unsigned)
        if: steps.signing.outputs.signed == 'false'
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Stop electron-builder from trying to find a Developer ID cert in
          # the runner's empty keychain. Produces an ad-hoc-signed artifact
          # — fine for internal testing, flagged by Gatekeeper for end users.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Verify macOS app bundle
        run: bash scripts/verify-macos-bundle.sh
        env:
          REQUIRE_GATEKEEPER_PASS: ${{ steps.verify.outputs.require_gatekeeper }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MeetingBoost-${{ github.ref_name }}
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_release == true
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.dmg
            release/*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
