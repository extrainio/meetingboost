name: CodeQL

# CodeQL static analysis for JS/TS sources.
#
# DISABLED on push/PR/schedule until the repo is made public — code scanning
# upload requires either a public repo (free) or GitHub Advanced Security on
# a paid plan. Triggered manually for now via workflow_dispatch; once the
# repo flips to public, restore the push/PR/schedule triggers below.
#
#   push:
#     branches: [main, master]
#   pull_request:
#     branches: [main, master]
#   schedule:
#     - cron: '17 6 * * 1'

on:
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript']

    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # security-extended pulls in the higher-noise / higher-recall query
          # set; appropriate for an Electron app with shell-out + IPC surface.
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:${{ matrix.language }}'
